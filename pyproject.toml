[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "few-shot-face-classification"
version = "0.0.1"
description = "Library to recognise and classify faces."
readme = "README.md"
requires-python = ">=3.9,<3.15"
authors = [{ name = "RubenPants", email = "broekxruben@gmail.com" }]
dependencies = [
    "facenet-pytorch==3.0.0",
    "Pillow",
    "matplotlib",
    "scikit-learn",
    "tqdm",
    "numpy",
    "opencv-python",
]

[project.urls]
Homepage = "https://github.com/RubenPants/FewShotFaceClassification"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
