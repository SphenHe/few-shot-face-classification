[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "few-shot-face-classification"
version = "0.0.1"
description = "Library to recognise and classify faces."
readme = "README.md"
requires-python = ">=3.8,<3.13"
authors = [
    { name = "RubenPants", email = "broekxruben@gmail.com" },
]
dependencies = [
    "facenet-pytorch>=2.5.2,<2.7",
    "Pillow",
    "matplotlib",
    "scikit-learn",
    "tqdm",
    "numpy",
    "opencv-python",
]

[project.urls]
Homepage = "https://github.com/RubenPants/FewShotFaceClassification"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
